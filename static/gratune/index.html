<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gratune</title>
    <meta
      name="description"
      content="Gratune is a calm daily Christian gratitude ritual with scripture, guided prayer, reminders, and private on-device journaling."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="brand" href="./">
          <img class="brand-mark" src="./assets/app-icon.png" alt="Gratune app icon" />
          <span class="brand-copy">
            <span class="brand-kicker">Christian gratitude app</span>
            <span class="brand-name">Gratune</span>
          </span>
        </a>
        <nav class="nav" aria-label="Primary">
          <a href="./marketing/">Marketing</a>
          <a href="./support/">Support</a>
          <a href="./privacy/">Privacy</a>
        </nav>
      </div>
    </header>

    <main class="site-shell">
      <section class="hero">
        <div class="hero-grid">
          <div class="hero-copy">
            <div class="eyebrow">Daily ritual</div>
            <h1>Grow closer to God through gratitude.</h1>
            <p>
              Gratune centers your day around one simple practice: read scripture, notice grace,
              and thank God with intention.
            </p>
            <div class="hero-actions">
              <a class="button-primary" href="./marketing/">Open marketing page</a>
              <a class="button-secondary" href="./support/">Open support page</a>
            </div>
          </div>

          <div class="phone-cluster" aria-hidden="true">
            <figure class="phone-card one">
              <img src="./assets/screenshots/welcome.png" alt="" />
            </figure>
            <figure class="phone-card two">
              <img src="./assets/screenshots/scripture.png" alt="" />
            </figure>
            <figure class="phone-card three">
              <img src="./assets/screenshots/entry.png" alt="" />
            </figure>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <span>Gratune</span>
        <a href="mailto:chaoliu@cedarville.edu">chaoliu@cedarville.edu</a>
      </div>
    </footer>
  </body>
</html>
